blueprint:
  name: "AI-Sähkövahti: Rakenteiden Ennakoiva Esilämmitys & Vyöhyke-/Ylläpito-ohjaus"
  description: "Ohjaa vyöhykkeen (ILP, VILP, patteriryhmä tai lattialämmitys) lämmitystä halpojen tuntien, aikataulun, senttihintakaton ja hintapiikkivaroituksen mukaisesti. Tukee kiinteää tavoitelämpötilaa, ulkolämpötila + offset -ylläpitoa (esim. +2 °C), pakko-ohitusta sekä loma-/ylläpitotilaa."
  domain: automation
  input:
    climate_entity:
      name: Lämmityslaite / Vyöhyke (Climate - ILP, VILP, patteriryhmä tai termostaatti)
      selector:
        entity:
          domain: climate
    best_hours_sensor:
      name: AI-Sähkövahti Optimaaliset Tunnit -sensori
      selector:
        entity:
          domain: sensor
    temp_mode:
      name: Lämpötilan valintatapa
      description: "Valitse käytetäänkö kiinteää peruslämpötilaa vai ulkolämpötilaan suhteutettua eroa (esim. +2 °C ulkolämpötilaa korkeampi)."
      default: "Kiinteä tavoite"
      selector:
        select:
          options:
            - "Kiinteä tavoite"
            - "Ulkolämpötila + offset"
    base_temperature:
      name: Haluttu normaali peruslämpötila (°C)
      description: "Käyttäjän valitsema normaali sisälämpötila tälle vyöhykkeelle (esim. alakerta 21.0 °C, yläkerta 17.0 °C tai mökki 10.0 °C)."
      default: 21.0
      selector:
        number:
          min: 5.0
          max: 26.0
          step: 0.5
          unit_of_measurement: "°C"
    outdoor_offset:
      name: Lämpötilaero ulkolämpötilaan offset-tilassa (°C)
      description: "Jos valittuna on 'Ulkolämpötila + offset', sisätavoite asetetaan näin monta astetta ulkolämpötilaa korkeammaksi (esim. 2.0 °C)."
      default: 2.0
      selector:
        number:
          min: -10.0
          max: 15.0
          step: 0.5
          unit_of_measurement: "°C"
    temp_boost_amount:
      name: Lämpötilan nosto halpoina tunteina (°C)
      description: "Kuinka monta astetta peruslämpötilaa nostetaan esilämmityksen aikana."
      default: 2.0
      selector:
        number:
          min: 0.0
          max: 6.0
          step: 0.5
          unit_of_measurement: "°C"
    max_target_temperature:
      name: Sallittu maksimilämpötila esilämmityksessä (°C)
      description: "Yläraja, johon asti lämpötilaa saa enintään nostaa halvoilla tunneilla tai ennen hintapiikkiä."
      default: 24.0
      selector:
        number:
          min: 8.0
          max: 28.0
          step: 0.5
          unit_of_measurement: "°C"
    min_comfort_temperature:
      name: Alin lämpötila, joka pidetään hinnasta huolimatta (°C)
      description: "Vyöhykkeen ehdoton alaraja, jonka alle lämpöä ei lasketa edes huippuhintojen aikana."
      default: 19.0
      selector:
        number:
          min: 3.0
          max: 24.0
          step: 0.5
          unit_of_measurement: "°C"
    control_mode:
      name: Ohjaustapa (halvat tunnit / aikataulu)
      description: "Valitse ohjataanko lämmitystä halvoilla tunneilla, aikataululla, molemmilla yhdessä vai ilman rajoitusta."
      default: "Halvat tunnit ja hintakatto"
      selector:
        select:
          options:
            - "Halvat tunnit ja hintakatto"
            - "Vain aikataulu"
            - "Molemmat yhdessä (aikataulu + halvat tunnit)"
            - "Ei hinta- tai aikataulurajoitusta"
    schedule_start:
      name: Aikataulun alkuaika (jos aikataulu käytössä)
      default: "22:00:00"
      selector:
        time: {}
    schedule_end:
      name: Aikataulun loppuaika (jos aikataulu käytössä)
      default: "07:00:00"
      selector:
        time: {}
    force_override_entity:
      name: Käyttäjän pakko-ohituskytkin (valinnainen)
      description: "Kun kytkin on ON (esim. saunan tai tilan välitön lämmitys), perus-/boost-lämpö pidetään kalliillakin tunnilla."
      default: ""
      selector:
        entity:
          domain: input_boolean
    vacation_mode_entity:
      name: Loma- / ylläpitotilakytkin (valinnainen)
      description: "Kun kytkin on ON, vyöhyke siirtyy ylläpitolämpötilaan."
      default: ""
      selector:
        entity:
          domain: input_boolean
    vacation_temp:
      name: Loma- / ylläpitotilan lämpötila (°C)
      description: "Tavoitelämpötila loma- tai ylläpitotilan aikana (esim. 10.0 °C)."
      default: 10.0
      selector:
        number:
          min: 5.0
          max: 20.0
          step: 0.5
          unit_of_measurement: "°C"
    spot_price_sensor:
      name: Nykyinen sähkön hinta -sensori (snt/kWh) (valinnainen)
      description: "Valitse sähkön nykyisen hinnan sensori, jos haluat käyttää maksimi senttihintarajaa."
      default: ""
      selector:
        entity:
          domain: sensor
    max_price_cents:
      name: Maksimi senttihinta massalämmitykselle (snt/kWh)
      description: "Jos sähkön hinta ylittää tämän rajan, esilämmitys katkaistaan ja siirrytään alimpaan mukavuusrajaan."
      default: 15.0
      selector:
        number:
          min: -50.0
          max: 200.0
          step: 0.5
          unit_of_measurement: "snt/kWh"
    spike_warning_sensor:
      name: AI-Sähkövahti Hintapiikkivaroitus-sensori (valinnainen)
      description: "Jos päällä, tehostaa esilämmitystä +0.5 °C (enintään sallittuun maksimilämpötilaan asti)."
      default: ""
      selector:
        entity:
          domain: sensor
    outdoor_temp_sensor:
      name: Ulkolämpötila-sensori (COP-pakkasraja & offset-tila)
      description: "Käytetään sekä ulkolämpötila + offset -laskentaan että pumpun COP-pakkasrajaan."
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature
    min_outdoor_temp_for_boost:
      name: Alin ulkolämpötila esilämmitykselle (°C)
      description: "Jos ulkolämpötila on tätä kylmempi, esilämmityksen lisänosto ohitetaan."
      default: -15.0
      selector:
        number:
          min: -35.0
          max: 5.0
          step: 1.0
          unit_of_measurement: "°C"
    floor_fault_alert_entity:
      name: Lämmityspiirin vikahälytys-lukitus (valinnainen)
      description: "Jos päällä (esim. input_boolean.floor_fault_alert), estää pumpun ylikuormituksen rajoittamalla lisänoston."
      default: ""
      selector:
        entity:
          domain: input_boolean
    decision_reason_helper:
      name: Audit-lokin syyteksti-helper (valinnainen)
      description: "Kirjaa päätöksen perustelun (esim. input_text.last_decision_reason)."
      default: ""
      selector:
        entity:
          domain: input_text

mode: single

trigger:
  - platform: time_pattern
    minutes: "/15"
  - platform: state
    entity_id: !input best_hours_sensor

variables:
  climate_ent: !input climate_entity
  best_hours_ent: !input best_hours_sensor
  v_temp_mode: !input temp_mode
  base_temp: !input base_temperature
  v_outdoor_offset: !input outdoor_offset
  boost: !input temp_boost_amount
  max_temp_cap: !input max_target_temperature
  min_comfort_temp: !input min_comfort_temperature
  v_control_mode: !input control_mode
  v_sched_start: !input schedule_start
  v_sched_end: !input schedule_end
  v_override_ent: !input force_override_entity
  v_vac_ent: !input vacation_mode_entity
  v_vac_temp: !input vacation_temp
  price_ent: !input spot_price_sensor
  max_price_limit: !input max_price_cents
  spike_ent: !input spike_warning_sensor
  outdoor_ent: !input outdoor_temp_sensor
  min_outdoor_temp: !input min_outdoor_temp_for_boost
  fault_alert_ent: !input floor_fault_alert_entity
  reason_helper: !input decision_reason_helper

  best_hours: "{{ state_attr(best_hours_ent, 'raw_hours') | default([], true) | list }}"
  current_hour_str: "{{ now().strftime('%H:00') }}"
  current_time_str: "{{ now().strftime('%H:%M:%S') }}"

  is_force_override: "{{ v_override_ent != '' and is_state(v_override_ent, 'on') }}"
  is_vacation: "{{ v_vac_ent != '' and is_state(v_vac_ent, 'on') }}"

  is_in_schedule: >
    {% if v_sched_start <= v_sched_end %}
      {{ v_sched_start <= current_time_str <= v_sched_end }}
    {% else %}
      {{ current_time_str >= v_sched_start or current_time_str <= v_sched_end }}
    {% endif %}

  current_price_cents: >
    {% if price_ent != '' and states(price_ent) not in ['unknown', 'unavailable', 'none'] %}
      {% set raw_p = states(price_ent) | float(0) %}
      {% set unit = state_attr(price_ent, 'unit_of_measurement') | default('snt/kWh', true) | lower %}
      {{ (raw_p * 100.0) if ('eur' in unit or '€' in unit) else raw_p }}
    {% else %}
      0.0
    {% endif %}
  is_price_too_high: "{{ price_ent != '' and current_price_cents > (max_price_limit | float(15.0)) }}"
  is_cheap_or_under_cap: >
    {{ (current_hour_str in best_hours) or (price_ent != '' and not is_price_too_high) }}

  is_mode_window_ok: >
    {% if v_control_mode == 'Halvat tunnit ja hintakatto' %}
      {{ is_cheap_or_under_cap }}
    {% elif v_control_mode == 'Vain aikataulu' %}
      {{ is_in_schedule }}
    {% elif v_control_mode == 'Molemmat yhdessä (aikataulu + halvat tunnit)' %}
      {{ is_in_schedule and is_cheap_or_under_cap }}
    {% else %}
      true
    {% endif %}

  outdoor_temp: >
    {% if outdoor_ent != '' and states(outdoor_ent) not in ['unknown', 'unavailable', 'none'] %}
      {{ states(outdoor_ent) | float(0) }}
    {% else %}
      0.0
    {% endif %}
  is_too_cold_for_cop: "{{ outdoor_ent != '' and outdoor_temp < (min_outdoor_temp | float(-15.0)) }}"
  is_fault_active: "{{ fault_alert_ent != '' and is_state(fault_alert_ent, 'on') }}"

  is_spike_coming: >
    {% if spike_ent != '' and states(spike_ent) not in ['unknown', 'unavailable', 'none'] %}
      {{ states(spike_ent) | lower in ['on', 'true', 'high', 'varoitus', '1'] }}
    {% else %}
      false
    {% endif %}

  # Lasketaan peruslämpötila joko kiinteänä tai ulkolämpötila + offset -kaavalla
  computed_base_temp: >
    {% if v_temp_mode == 'Ulkolämpötila + offset' and outdoor_ent != '' %}
      {{ (outdoor_temp + (v_outdoor_offset | float(2.0))) | round(1) }}
    {% else %}
      {{ base_temp | float(21.0) }}
    {% endif %}

  effective_boost: "{{ (boost | float(2.0)) + (0.5 if is_spike_coming else 0.0) }}"
  raw_boost_temp: "{{ computed_base_temp + effective_boost }}"
  capped_boost_temp: "{{ [[raw_boost_temp, max_temp_cap | float(24.0)] | min, min_comfort_temp | float(19.0)] | max }}"
  safe_base_temp: "{{ [[computed_base_temp, max_temp_cap | float(24.0)] | min, min_comfort_temp | float(19.0)] | max }}"
  safe_vacation_temp: "{{ [[v_vac_temp | float(10.0), max_temp_cap | float(24.0)] | min, min_comfort_temp | float(19.0)] | max }}"

action:
  - choose:
      # 1. KÄYTTÄJÄN PAKKO-OHITUS: Lämmittää heti haluttuun tasoon hinnasta ja aikataulusta riippumatta
      - conditions:
          - condition: template
            value_template: "{{ is_force_override }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ capped_boost_temp }}"
          - if:
              - condition: template
                value_template: "{{ reason_helper != '' }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: !input decision_reason_helper
                data:
                  value: "Pakko-ohitus aktiivinen ({{ climate_ent }}): tavoite {{ capped_boost_temp }} °C."

      # 2. LOMA- / YLLÄPITOTILA: Asettaa vyöhykkeen ylläpitolämpötilaan (esim. 10 °C tai offset)
      - conditions:
          - condition: template
            value_template: "{{ is_vacation }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ safe_vacation_temp }}"
          - if:
              - condition: template
                value_template: "{{ reason_helper != '' }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: !input decision_reason_helper
                data:
                  value: "Loma-/ylläpitotila ({{ climate_ent }}): tavoite {{ safe_vacation_temp }} °C."

      # 3. HINTA YLITTÄÄ MAKSIMI SENTTIHINNAN (kun ei pakko-ohitusta eikä pelkkä aikataulu): Siirrytään alimpaan mukavuusrajaan
      - conditions:
          - condition: template
            value_template: "{{ is_price_too_high and v_control_mode in ['Halvat tunnit ja hintakatto', 'Molemmat yhdessä (aikataulu + halvat tunnit)'] }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ min_comfort_temp }}"
          - if:
              - condition: template
                value_template: "{{ reason_helper != '' }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: !input decision_reason_helper
                data:
                  value: "Massalämmitys seis ({{ climate_ent }}): hinta {{ current_price_cents | round(1) }} snt > {{ max_price_limit }} snt -> alaraja {{ min_comfort_temp }} °C."

      # 4. TURVALUKITUS: Lämmityspiirivika tai liian kova pakkanen COP-käyrälle -> pidetään laskettu peruslämpö
      - conditions:
          - condition: template
            value_template: "{{ is_mode_window_ok and (is_fault_active or is_too_cold_for_cop) }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ safe_base_temp }}"
          - if:
              - condition: template
                value_template: "{{ reason_helper != '' }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: !input decision_reason_helper
                data:
                  value: >
                    Esilämmitys ohitettu ({{ climate_ent }}):
                    {{ 'lämmityspiirin vikahälytys aktiivinen' if is_fault_active else 'ulkolämpötila ' ~ outdoor_temp ~ ' °C alle COP-rajan ' ~ min_outdoor_temp ~ ' °C' }} -> peruslämpö {{ safe_base_temp }} °C.

      # 5. AKTIIVINEN OHJAUSIKKUNA (halvat tunnit / aikataulu / molemmat): Nostetaan lämpötilaa enintään sallittuun maksimirajaan asti
      - conditions:
          - condition: template
            value_template: "{{ is_mode_window_ok }}"
        sequence:
          - service: climate.set_temperature
            target:
              entity_id: !input climate_entity
            data:
              temperature: "{{ capped_boost_temp }}"
          - if:
              - condition: template
                value_template: "{{ reason_helper != '' }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: !input decision_reason_helper
                data:
                  value: "Esilämmitys ({{ climate_ent }}, {{ v_control_mode }}): tavoite {{ capped_boost_temp }} °C (perus {{ safe_base_temp }} °C)."

    default:
      # 6. Muina tunteina palautetaan laskettuun peruslämpötilaan (kiinteä tai ulkolämpötila + offset)
      - service: climate.set_temperature
        target:
          entity_id: !input climate_entity
        data:
          temperature: "{{ safe_base_temp }}"
