blueprint:
  name: "AI-Sähkövahti: Älykäs Lämminvesivaraajan Ohjaus & Legionella-turva (Profiilituki)"
  description: "Optimoi lämminvesivaraajan lämmityksen AI-Sähkövahdin parhaiden tuntien, senttihintakaton ja keskuksen turvatehorajan mukaan varmistaen aina ehdottoman Legionella-turvarajan."
  domain: automation
  input:
    water_heater_entity:
      name: Lämminvesivaraaja (Climate tai Switch)
      selector:
        entity:
          domain: ["climate", "switch"]
    water_temp_sensor:
      name: Varaajan lämpötila-anturi
      selector:
        entity:
          domain: sensor
          device_class: temperature
    best_hours_sensor:
      name: AI-Sähkövahti Optimaaliset Tunnit -sensori
      selector:
        entity:
          domain: sensor
    min_safe_temp:
      name: Ehdoton minimilämpötila (Legionella-turva, °C)
      description: "Jos vesi laskee tämän alle, lämmitys pakotetaan päälle hinnasta riippumatta."
      default: 55
      selector:
        number:
          min: 50
          max: 65
          step: 1
          unit_of_measurement: "°C"
    max_water_temp:
      name: Varaajan tavoite- / maksimilämpötila (°C)
      description: "Lämpötila, jonka saavuttamisen jälkeen varaajaa ei lämmitetä enempää."
      default: 75
      selector:
        number:
          min: 60
          max: 85
          step: 1
          unit_of_measurement: "°C"
    spot_price_sensor:
      name: Nykyinen sähkön hinta -sensori (snt/kWh) (valinnainen)
      default: ""
      selector:
        entity:
          domain: sensor
    max_price_cents:
      name: Maksimi senttihinta lämmitykselle (snt/kWh)
      description: "Jos hinta ylittää tämän rajan, normaali lämmitys estetään (Legionella-turva silti aktiivinen)."
      default: 20.0
      selector:
        number:
          min: 0.0
          max: 200.0
          step: 0.5
          unit_of_measurement: "snt/kWh"
    indoor_temp_sensor:
      name: Kodin sisälämpötila-anturi (valinnainen)
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: temperature
    max_indoor_temp:
      name: Sisälämpötilan yläraja esilämmityksen estolle (°C)
      default: 23.5
      selector:
        number:
          min: 18.0
          max: 26.0
          step: 0.5
          unit_of_measurement: "°C"
    panel_total_power_sensor:
      name: Ryhmä- tai pääkeskuksen kokonaisteho (kW tai W) (valinnainen)
      description: "Kuormanhallinta: estää sulakkeiden ylikuormituksen, jos keskuksen turvaraja ylittyy."
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: power
    panel_max_safe_kw_helper:
      name: Ryhmä- tai pääkeskuksen turvatehoraja-helper (kW) (valinnainen)
      description: "Esim. input_number.house_max_safe_kw (oletus 15.0 kW)."
      default: ""
      selector:
        entity:
          domain: input_number
    decision_reason_helper:
      name: Audit-lokin syyteksti-helper (valinnainen)
      description: "Kirjaa päätöksen perustelun (esim. input_text.last_decision_reason)."
      default: ""
      selector:
        entity:
          domain: input_text

mode: single

trigger:
  - platform: time_pattern
    hours: "/1"
  - platform: state
    entity_id: !input water_temp_sensor
  - platform: state
    entity_id: !input best_hours_sensor

variables:
  heater_ent: !input water_heater_entity
  water_temp_ent: !input water_temp_sensor
  best_hours_ent: !input best_hours_sensor
  min_temp: !input min_safe_temp
  max_temp: !input max_water_temp
  price_ent: !input spot_price_sensor
  max_price_limit: !input max_price_cents
  indoor_ent: !input indoor_temp_sensor
  max_indoor: !input max_indoor_temp
  panel_power_ent: !input panel_total_power_sensor
  panel_safe_kw_helper: !input panel_max_safe_kw_helper
  reason_helper: !input decision_reason_helper

  water_temp: "{{ states(water_temp_ent) | float(60) }}"
  best_hours: "{{ state_attr(best_hours_ent, 'raw_hours') | default([], true) | list }}"
  current_time: "{{ now().strftime('%H:00') }}"
  indoor_temp: >
    {% if indoor_ent != '' and states(indoor_ent) not in ['unknown', 'unavailable', 'none'] %}
      {{ states(indoor_ent) | float(20) }}
    {% else %}
      20.0
    {% endif %}
  current_price_cents: >
    {% if price_ent != '' and states(price_ent) not in ['unknown', 'unavailable', 'none'] %}
      {% set raw_p = states(price_ent) | float(0) %}
      {% set unit = state_attr(price_ent, 'unit_of_measurement') | default('snt/kWh', true) | lower %}
      {{ (raw_p * 100.0) if ('eur' in unit or '€' in unit) else raw_p }}
    {% else %}
      0.0
    {% endif %}
  is_price_too_high: "{{ price_ent != '' and current_price_cents > (max_price_limit | float(20.0)) }}"
  safe_limit_kw: >
    {% if panel_safe_kw_helper != '' and states(panel_safe_kw_helper) not in ['unknown', 'unavailable', 'none'] %}
      {{ states(panel_safe_kw_helper) | float(15.0) }}
    {% else %}
      15.0
    {% endif %}
  current_panel_kw: >
    {% if panel_power_ent != '' and states(panel_power_ent) not in ['unknown', 'unavailable', 'none'] %}
      {% set raw_val = states(panel_power_ent) | float(0) %}
      {% set unit = state_attr(panel_power_ent, 'unit_of_measurement') | default('kW', true) %}
      {{ (raw_val / 1000.0) if unit == 'W' else raw_val }}
    {% else %}
      0.0
    {% endif %}
  is_panel_overloaded: "{{ panel_power_ent != '' and current_panel_kw > safe_limit_kw }}"

action:
  - choose:
      # 1. LEGIONELLA-TURVAVAHTI: Jos vesi on alle minimirajan, pakota lämmitys päälle hinnasta riippumatta!
      - conditions:
          - condition: template
            value_template: "{{ water_temp < (min_temp | float(55)) }}"
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: !input water_heater_entity
          - service: persistent_notification.create
            data:
              title: "AI-Sähkövahti: Legionella-turvavahti aktivoitunut"
              message: "Varaajan lämpötila ({{ water_temp }} °C) alitti turvarajan ({{ min_temp }} °C). Lämmitys pakotettu päälle."
          - if:
              - condition: template
                value_template: "{{ reason_helper != '' }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: !input decision_reason_helper
                data:
                  value: "Varaaja pakotettu päälle (Legionella-turva): {{ water_temp }} °C < {{ min_temp }} °C."

      # 2. SULAKESUOJA (Safety): Jos keskuksen teho ylittää turvarajan, väistetään hetkellisesti
      - conditions:
          - condition: template
            value_template: "{{ is_panel_overloaded }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: !input water_heater_entity
          - if:
              - condition: template
                value_template: "{{ reason_helper != '' }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: !input decision_reason_helper
                data:
                  value: "Varaaja keskeytetty: keskuksen teho {{ current_panel_kw | round(1) }} kW ylittää rajan {{ safe_limit_kw }} kW."

      # 3. YLÄRAJAT & HINTAKATTO: Jos vesi on jo maksimissa, koti liian lämmin tai hinta yli katon
      - conditions:
          - condition: template
            value_template: "{{ water_temp >= (max_temp | float(75)) or (indoor_ent != '' and indoor_temp > (max_indoor | float(23.5))) or is_price_too_high }}"
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: !input water_heater_entity

      # 4. HINTA-OPTIMOINTI: Edullinen tunti ja varaaja kaipaa lämpöä
      - conditions:
          - condition: template
            value_template: "{{ current_time in best_hours }}"
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: !input water_heater_entity
          - if:
              - condition: template
                value_template: "{{ reason_helper != '' }}"
            then:
              - service: input_text.set_value
                target:
                  entity_id: !input decision_reason_helper
                data:
                  value: "Varaaja lämmittää ({{ current_time }}): veden lämpö {{ water_temp }} °C / tavoite {{ max_temp }} °C."

    default:
      # 5. Muina tunteina pidetään pois päältä (paitsi jos ollaan vielä Legionella-lämmityksen hystereesialueella)
      - if:
          - condition: template
            value_template: "{{ water_temp >= ((min_temp | float(55)) + 3.0) }}"
        then:
          - service: homeassistant.turn_off
            target:
              entity_id: !input water_heater_entity
