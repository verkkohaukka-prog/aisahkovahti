# Lämpöpumppujen vyöhykeprofiilit (VIP-kaavakkeen kohta 2)
heat_pumps:
  - id: ilp_1
    name: "ILP 1 – Alakerta"
    type: ilp
    zone: alakerta
    climate_entity: climate.ilp_alakerta
    scop: 4.6
    nominal_kw: 2.5
    min_kw: 0.9
    max_kw: 5.0
    heat_load_w_per_k: 55
    cop_curve:
      - {outdoor_c: -20, cop: 1.6}
      - {outdoor_c: -15, cop: 1.9}
      - {outdoor_c: -5,  cop: 2.8}
      - {outdoor_c: 5,   cop: 4.2}
      - {outdoor_c: 15,  cop: 5.5}
    temp_control:
      mode: "Kiinteä tavoite"
      base_temp_c: 21.0
      outdoor_offset_c: 2.0
      boost_temp_c: 2.0
      max_temp_c: 24.0
      min_comfort_temp_c: 19.0
    operating_rules:
      control_mode: "Halvat tunnit ja hintakatto"
      max_price_cents: 15.0
      schedule_enabled: false
      schedule_start: "22:00:00"
      schedule_end: "07:00:00"
      min_outdoor_temp_for_boost_c: -15.0
      allow_manual_override: true
      vacation_mode_enabled: false
      vacation_temp_c: 10.0

  - id: vilp_1
    name: "VILP – Päälämmitys"
    type: vilp
    zone: koko_talo
    climate_entity: climate.vilp_paalampo
    scop: 3.9
    nominal_kw: 6.0
    min_kw: 1.5
    max_kw: 12.0
    heat_load_w_per_k: 80
    cop_curve:
      - {outdoor_c: -20, cop: 1.5}
      - {outdoor_c: -15, cop: 1.8}
      - {outdoor_c: -5,  cop: 2.5}
      - {outdoor_c: 5,   cop: 3.8}
      - {outdoor_c: 15,  cop: 4.8}
    temp_control:
      mode: "Kiinteä tavoite"
      base_temp_c: 20.5
      outdoor_offset_c: 2.0
      boost_temp_c: 1.5
      max_temp_c: 23.0
      min_comfort_temp_c: 18.5
    operating_rules:
      control_mode: "Halvat tunnit ja hintakatto"
      max_price_cents: 12.0
      schedule_enabled: false
      schedule_start: "22:00:00"
      schedule_end: "07:00:00"
      min_outdoor_temp_for_boost_c: -18.0
      allow_manual_override: true
      vacation_mode_enabled: true
      vacation_temp_c: 10.0
